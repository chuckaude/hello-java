# example workflow for Coverity scans using the Black Duck Security Scan Action
# https://github.com/marketplace/actions/black-duck-security-scan
# with Coverity idir caching
# https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows
name: coverity-ss-action
on:
  push:
    branches: [ main, master, develop, stage, release ]
  pull_request:
    branches: [ main, master, develop, stage, release ]
  workflow_dispatch:
jobs:
  coverity:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Java JDK
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        java-version: 25
        distribution: temurin
        cache: maven
    - name: Restore Coverity iDir
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v.6.1.0
      with:
        path: .bridge/**/idir
        key: coverity-idir-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: coverity-idir-${{ runner.os }}-${{ runner.arch }}-
    - name: Coverity Scan
      uses: blackduck-inc/black-duck-security-scan@152247222aa9cd38124acd5c0cf60f4db71adc3f # v2.11.0
      with:
        coverity_url: ${{ vars.COVERITY_URL }}
        coverity_user: ${{ secrets.COV_USER }}
        coverity_passphrase: ${{ secrets.COVERITY_PASSPHRASE }}
        coverity_policy_view: ${{ github.event_name != 'pull_request' && 'Outstanding Issues' || '' }}
        coverity_prComment_enabled: true
        coverity_build_command: mvn -B -DskipTests package
        coverity_clean_command: mvn -B clean
        # coverity_local: true
        github_token: ${{ secrets.GITHUB_TOKEN }}
        include_diagnostics: false
    - name: Save Coverity iDir
      if: always()
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v.6.1.0
      with:
        path: .bridge/**/idir
        key: coverity-idir-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
