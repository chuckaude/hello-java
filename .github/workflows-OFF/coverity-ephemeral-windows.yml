# demonstrate Coverity toolkit caching on ephemeral build agents
name: coverity-ephemeral-windows
on:
  push:
    branches: [ main, master, develop, stage, release ]
  workflow_dispatch:
jobs:
  coverity:
    runs-on: windows-latest
    env:
      COVERITY_URL: ${{ vars.COVERITY_URL }}
      COV_USER: ${{ secrets.COV_USER }}
      COVERITY_PASSPHRASE: ${{ secrets.COVERITY_PASSPHRASE }}
      COVERITY_PROJECT: ${{ github.event.repository.name }}
      COVERITY_STREAM: ${{ github.event.repository.name }}-${{ github.ref_name }}
      COVERITY_TOOLKIT: cov-analysis-win64-2023.12.2
    steps:
    - name: Checkout Source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Java JDK
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        java-version: 25
        distribution: temurin
        cache: maven
    # designate the Coverity toolkit as something to cache, for more details see:
    # https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows
    - name: Cache Coverity Toolkit
      id: cache-coverity
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v.6.1.0
      with:
        path: ${{ runner.temp }}/${{ env.COVERITY_TOOLKIT }}
        key: ${{ env.COVERITY_TOOLKIT }}
    # download Coverity only if cache-hit from above is not true
    - name: Coverity Download
      if: ${{ steps.cache-coverity.outputs.cache-hit != 'true' }}
      run: |
        $INSTALLER=${env:COVERITY_TOOLKIT}+".exe"
        cd ${{ runner.temp }}
        curl -fs --user ${env:COV_USER}:${env:COVERITY_PASSPHRASE} -o $INSTALLER ${env:COVERITY_URL}/downloadFile.htm?fn=$INSTALLER
        curl -fs --user ${env:COV_USER}:${env:COVERITY_PASSPHRASE} -o license.dat ${env:COVERITY_URL}/downloadFile.htm?fn=license.dat
        cmd /c start /wait $INSTALLER -q -console --installation.dir=${{ runner.temp }}/${env:COVERITY_TOOLKIT} --component.sdk=false `
          --license.agreement=agree --license.region=0 --license.type.choice=0 --license.cov.path=${{ runner.temp }}/license.dat
    - name: Coverity Scan
      run: |
        $env:PATH += ";${{ runner.temp }}/${env:COVERITY_TOOLKIT}/bin"
        coverity scan -o commit.connect.url=${env:COVERITY_URL} -o commit.connect.project=${env:COVERITY_PROJECT} -o commit.connect.stream=${env:COVERITY_STREAM}
